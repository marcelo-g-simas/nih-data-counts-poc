[project]
name = "data-counts-central"
version = "0.1.0"
description = "Data COUNTS central platform: PPRL token resolution + cross-site probabilistic linkage (RFI 75N95C26R00005, Req 5)."
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "typer==0.12.5",
    "click==8.1.8",  # typer 0.12.x breaks on click>=8.2; spindle-token needs >=8.1.8
    "duckdb==1.1.3",
    "pyarrow==17.0.0",
    "pandas==2.2.3",  # already pulled in transitively by splink; pinned explicitly since evaluation.py imports it directly
    "cryptography>=50.0.0",
    "spindle-token==2.4.2",  # generate_pem_keys() only -- no pyspark import required
    "splink==4.0.17",        # DuckDB backend by default; the `pyspark`/`spark` extra is never installed
    "rich==13.9.4",
    "fastapi==0.115.6",       # Program API (Req 15) -- central-only, `site/` never needs a web framework
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.20",  # multipart form parsing for the package-upload route
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff>=0.5",
    "httpx==0.27.2",  # required by fastapi.testclient.TestClient
]

[project.scripts]
data-counts-central = "data_counts_central.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_counts_central"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
