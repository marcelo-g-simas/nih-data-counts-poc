[project]
name = "data-counts-site"
version = "0.1.0"
description = "NIH Data COUNTS (RFI 75N95C26R00005) leave-behind pipeline POC — synthetic data only, no real PHI."
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "typer==0.12.5",
    "click==8.1.8",  # typer 0.12.x breaks on click>=8.2; spindle-token needs >=8.1.8
    "pydantic==2.9.2",
    "duckdb==1.1.3",
    "pyarrow==17.0.0",
    "numpy==1.26.4",
    "cumulus-fhir-support==1.12.2",
    "cryptography>=50.0.0",
    "spindle-token==2.4.2",
    "jellyfish==1.2.1",  # soundex/metaphone for OPPRL token2/token3 -- the same library spindle-token itself uses
    "presidio-analyzer==2.2.355",
    "presidio-anonymizer==2.2.355",
    "fast_gliner==0.2.1",  # Rust (gline-rs) + ONNX Runtime GLiNER binding -- no torch/transformers/onnx
    "huggingface_hub==0.36.2",  # model download for fast_gliner's setup-models step
    "spacy==3.7.5",
    "philter-lite==0.6.0",
    "faker==25.9.2",
    "rich==13.9.4",
    "en-core-web-sm",
    "textual==6.2.1",
    "httpx==0.27.2",  # central_client.py -- optional API-transmission path for export-linkage-demo-sites/fetch-linkage-result
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==1.3.0",  # for Textual's App.run_test() pilot harness in test_tui.py
    "ruff>=0.5",
]

[project.scripts]
data-counts = "data_counts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_counts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
# Presidio's SpacyNlpEngine auto-downloads its model via `pip` at first `.load()` if it can't
# see the package installed -- and a `uv`-managed venv doesn't ship `pip`, so that fallback
# fails hard (and would be an undocumented run-time network call besides). Declaring the model
# as a real pinned dependency means every `uv sync` installs (and never silently prunes) it,
# so presidio finds it already present and never takes that path.
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl" }
