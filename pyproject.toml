[project]
name = "data-counts-poc"
version = "0.1.0"
description = "NIH Data COUNTS (RFI 75N95C26R00005) leave-behind pipeline POC — synthetic data only, no real PHI."
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "typer==0.12.5",
    "click==8.1.8",  # typer 0.12.x breaks on click>=8.2; spindle-token needs >=8.1.8
    "pydantic==2.9.2",
    "duckdb==1.1.3",
    "pyarrow==17.0.0",
    "numpy==1.26.4",
    "cumulus-fhir-support==1.12.2",
    "cryptography>=50.0.0",
    "spindle-token==2.4.2",
    "presidio-analyzer==2.2.355",
    "presidio-anonymizer==2.2.355",
    "gliner==0.2.28",  # 0.2.13 (the original pin) has no export_to_onnx(); 0.2.24+ added it
    "transformers==4.57.3",  # gliner>=0.2.24 requires transformers>=4.51.3 for export_to_onnx()
    "torch==2.4.1",
    "onnxruntime==1.19.2",
    "onnx==1.17.0",  # required by onnxruntime.quantization for gliner's INT8 export path
    "spacy==3.7.5",
    "philter-lite==0.6.0",
    "faker==25.9.2",
    "rich==13.9.4",
    "en-core-web-sm",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff>=0.5",
]

[project.scripts]
data-counts = "data_counts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_counts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# CPU-only torch: pulled in transitively by gliner (its NER runtime). Pinning it to the
# small, dedicated PyTorch CPU wheel index keeps `uv sync` fast (no CUDA-variant search)
# and enforces the "no GPU anywhere" hard constraint at the dependency-resolution level,
# not just at call sites.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# Presidio's SpacyNlpEngine auto-downloads its model via `pip` at first `.load()` if it can't
# see the package installed -- and a `uv`-managed venv doesn't ship `pip`, so that fallback
# fails hard (and would be an undocumented run-time network call besides). Declaring the model
# as a real pinned dependency means every `uv sync` installs (and never silently prunes) it,
# so presidio finds it already present and never takes that path.
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl" }
